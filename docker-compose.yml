name: architeezy

services:
  frontend:
    image: aresekb/architeezy-frontend:latest
    container_name: architeezy-frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      API_GATEWAY_URL: http://architeezy-api-gateway:8081
    ports:
      - 127.0.0.1:${FRONTEND_PORT}:80
    restart: unless-stopped

  api-gateway:
    image: aresekb/architeezy-api-gateway:latest
    container_name: architeezy-api-gateway
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      APPLICATION_URL: ${APPLICATION_URL}
      BACKEND_URL: http://backend:8082
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ALLOWED_ORIGIN_PATTERNS: ${ALLOWED_ORIGIN_PATTERNS}
      OAUTH2_ISSUER_URL: ${OAUTH2_ISSUER_URL}
      OAUTH2_AUTHORIZATION_URL: ${OAUTH2_AUTHORIZATION_URL}
      OAUTH2_ACCOUNT_URL: ${OAUTH2_ACCOUNT_URL}
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      OAUTH2_API_CLIENT_ID: ${OAUTH2_API_CLIENT_ID}
      OAUTH2_TOKEN_URL: ${OAUTH2_TOKEN_URL}
      OAUTH2_JWK_SET_URL: ${OAUTH2_JWK_SET_URL}
      OAUTH2_USER_INFO_URL: ${OAUTH2_USER_INFO_URL}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_SESSION_TIMEOUT: ${SESSION_TIMEOUT}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_PROTOCOL: ${SMTP_PROTOCOL}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SSL_ENABLED: ${SMTP_SSL_ENABLED}
      SMTP_STARTTLS_ENABLED: ${SMTP_STARTTLS_ENABLED}
      SMTP_MAIL_FROM: ${SMTP_MAIL_FROM}
      SMTP_MAIL_TO: ${SMTP_MAIL_TO}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:8.6.3-alpine3.23
    container_name: architeezy-redis
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    environment:
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - architeezy-redis-data:/data
    ports:
      - 127.0.0.1:${REDIS_PORT}:6379
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $REDIS_PASSWORD ping | grep PONG']
      start_period: 30s
    restart: unless-stopped

  backend:
    image: aresekb/architeezy-backend:latest
    container_name: architeezy-backend
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      APPLICATION_URL: ${APPLICATION_URL}
      METAMODEL_URL: ${METAMODEL_URL}
      API_GATEWAY_URL: ${API_GATEWAY_URL}
      OAUTH2_JWK_SET_URL: ${OAUTH2_JWK_SET_URL}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/architeezy?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      OPENAI_URL: ${OPENAI_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      start_period: 60s
    restart: unless-stopped

  db:
    image: postgres:18.4-alpine3.23
    container_name: architeezy-db
    environment:
      POSTGRES_DB: architeezy
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - architeezy-db-data:/var/lib/postgresql
    ports:
      - 127.0.0.1:${DATABASE_PORT}:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $DATABASE_USERNAME']
      start_period: 30s
    restart: unless-stopped

  keycloak:
    image: aresekb/architeezy-keycloak:latest
    container_name: architeezy-keycloak
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_HOSTNAME: ${KEYCLOAK_URL}
      KC_HTTP_ENABLED: true
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DATABASE_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD}
      KEYCLOAK_REDIRECT_URL: ${API_GATEWAY_URL}/login/oauth2/code/keycloak
      KEYCLOAK_WEB_ORIGIN_URL: ${APPLICATION_URL}
      KEYCLOAK_JUPYTERHUB_URL: ${JUPYTERHUB_URL}
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT}:8080
    healthcheck:
      start_period: 60s
    restart: unless-stopped

  keycloak-db:
    image: postgres:18.4-alpine3.23
    container_name: architeezy-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD}
    volumes:
      - architeezy-keycloak-db-data:/var/lib/postgresql
    ports:
      - 127.0.0.1:${KEYCLOAK_DATABASE_PORT}:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $KEYCLOAK_DATABASE_USERNAME']
      start_period: 30s
    restart: unless-stopped

volumes:
  architeezy-db-data:
  architeezy-redis-data:
  architeezy-keycloak-db-data:
